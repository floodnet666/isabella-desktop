[project]
name = "isabella-desktop"
version = "0.1.0"
description = "Isabella Desktop Companion - 3DGS, Low-Latency Voice and HippoRAG 2 Multi-Session Memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "requests>=2.28.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
